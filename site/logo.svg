<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#25252c"/>
      <stop offset="1" stop-color="#111114"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d97757" stop-opacity=".45"/>
      <stop offset="1" stop-color="#d97757" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- the tile -->
  <rect x="46" y="46" width="932" height="932" rx="200" fill="url(#tile)"/>
  <rect x="47.5" y="47.5" width="929" height="929" rx="198.5" fill="none" stroke="#ffffff" stroke-opacity=".07" stroke-width="3"/>
  <!-- the hive: one lit cell with a quieter one beside it -->
  <circle cx="690" cy="300" r="200" fill="url(#glow)"/>
  <path d="M690 174 L799.1 237 L799.1 363 L690 426 L580.9 363 L580.9 237 Z" fill="#d97757"/>
  <path d="M690 250 L733.3 275 L733.3 325 L690 350 L646.7 325 L646.7 275 Z" fill="#7a3b27"/>
  <path d="M810 390 L912.2 449 L912.2 567 L810 626 L707.8 567 L707.8 449 Z" fill="none" stroke="#d97757" stroke-opacity=".6" stroke-width="18" stroke-linejoin="round"/>
  <!-- the prompt -->
  <path d="M238 440 L402 555 L238 670" fill="none" stroke="#f2f2f2" stroke-width="58" stroke-linecap="square" stroke-linejoin="miter"/>
  <rect x="452" y="690" width="244" height="72" rx="16" fill="#f2f2f2"/>
</svg>
